<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Coronavirus Shooting Game</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<div class="app-container">
		<!-- Header UI -->
		<header class="game-header">
			<div class="header-top">
				<div class="icon-box">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="9"/>
						<line x1="12" y1="3" x2="12" y2="7"/>
						<line x1="12" y1="17" x2="12" y2="21"/>
						<line x1="3" y1="12" x2="7" y2="12"/>
						<line x1="17" y1="12" x2="21" y2="12"/>
					</svg>
				</div>
				<div class="header-titles">
					<div class="title-row">
						<h1>Coronavirus Shooting Game</h1>
						<span class="badge">Pex.Js</span>
					</div>
					<p>Designed & Developed by Jansen</p>
				</div>
			</div>
			
			<div class="controls-row">
				<button class="btn-icon" id="btn-sound" title="Sound">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
				</button>
				<button class="btn-icon" id="btn-restart" onclick="newGame()" title="Restart">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
				</button>
				<button class="btn-icon" id="btn-info" title="Info">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
				</button>
				<button class="btn-icon" id="btn-fullscreen" onclick="toggleFullscreen()" title="Fullscreen">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
				</button>
			</div>
		</header>

		<!-- Game Canvas Container -->
		<main class="canvas-wrapper">
			<canvas id="canvas" width="1280" height="720"></canvas>
		</main>
	</div>

	<script src="./script.js"></script>
</body>
</html>
