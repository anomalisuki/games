<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Coronavirus Shooting Game</title>
	<link rel="stylesheet" href="./style.css">
	<style>
		/* Penyesuaian Overlay Start Game */
		.canvas-wrapper {
			position: relative;
		}

		#start-overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.85);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 999;
			border-radius: inherit;
		}

		#btn-start {
			padding: 15px 40px;
			font-size: 22px;
			font-weight: bold;
			color: #000;
			background-color: #00ffff;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			box-shadow: 0 0 15px #00ffff;
			transition: transform 0.2s, box-shadow 0.2s;
		}

		#btn-start:hover {
			transform: scale(1.05);
			box-shadow: 0 0 25px #00ffff;
		}
	</style>
</head>
<body>
	<div class="app-container">
		<!-- Header UI -->
		<header class="game-header">
			<div class="header-top">
				<div class="icon-box">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="9"/>
						<line x1="12" y1="3" x2="12" y2="7"/>
						<line x1="12" y1="17" x2="12" y2="21"/>
						<line x1="3" y1="12" x2="7" y2="12"/>
						<line x1="17" y1="12" x2="21" y2="12"/>
					</svg>
				</div>
				<div class="header-titles">
					<div class="title-row">
						<h1>Virus Shooting Game</h1>
					</div>
					<p>Designed & Developed by Vidzz DEV</p>
				</div>
			</div>
			
			<div class="controls-row">
				<button class="btn-icon" id="btn-sound" onclick="toggleSound()" title="Sound">
					<svg id="icon-sound" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
						<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
					</svg>
				</button>
				<button class="btn-icon" id="btn-fullscreen" onclick="toggleFullscreen()" title="Fullscreen">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
				</button>
			</div>
		</header>

		<!-- Game Canvas Container -->
		<main class="canvas-wrapper">
			<!-- Overlay Tombol Start -->
			<div id="start-overlay">
				<h2 style="color: #00ffff; margin-bottom: 20px; font-family: sans-serif;">CLICK TO START GAME</h2>
				<button id="btn-start">START GAME</button>
			</div>

			<canvas id="canvas" width="1280" height="720"></canvas>
		</main>
	</div>

	<script src="./script.js"></script>

	<!-- Script Kontrol UI (Sound & Fullscreen) -->
	<script>
		var isMuted = false;

		// Fungsi Toggle Mute/Unmute Suara
		function toggleSound() {
			isMuted = !isMuted;
			var soundIcon = document.getElementById('icon-sound');

			if (isMuted) {
				// Ikon Mute (Speaker + Garis Miring)
				soundIcon.innerHTML = `
					<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
					<line x1="23" y1="1" x2="1" y2="23"/>
				`;
			} else {
				// Ikon Normal (Volume On)
				soundIcon.innerHTML = `
					<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
					<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
				`;
			}
		}

		// Fungsi Toggle Fullscreen Canvas / Elemen
		function toggleFullscreen() {
			var elem = document.querySelector('.app-container') || document.documentElement;

			if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
				if (elem.requestFullscreen) {
					elem.requestFullscreen();
				} else if (elem.msRequestFullscreen) {
					elem.msRequestFullscreen();
				} else if (elem.mozRequestFullScreen) {
					elem.mozRequestFullScreen();
				} else if (elem.webkitRequestFullscreen) {
					elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
				}
			} else {
				if (document.exitFullscreen) {
					document.exitFullscreen();
				} else if (document.msExitFullscreen) {
					document.msExitFullscreen();
				} else if (document.mozCancelFullScreen) {
					document.mozCancelFullScreen();
				} else if (document.webkitExitFullscreen) {
					document.webkitExitFullscreen();
				}
			}
		}
	</script>
</body>
</html>
